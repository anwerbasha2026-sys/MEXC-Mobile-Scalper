name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev
          pip install --upgrade pip setuptools
          pip install buildozer cython

      - name: Pre-accept Android Licenses & Setup SDK
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n8937 chemically-generated-key-hash-here\n248315973000" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n84831b94fe1bc80d6f22849b3ae3d289e6eb293a" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\nd56f51856113360241c8d62f482d8d85fe4e89fe" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

      - name: Build APK with Buildozer
        run: |
          # قبول الشروط تلقائياً لأي حزمة يحملها buildozer
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: python-app-apk
          path: bin/*.apk
